version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: monapp-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: monapp
      MYSQL_USER: monapp_user
      MYSQL_PASSWORD: monapp_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent" ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s

  app:
    build: .
    container_name: monapp-web
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/monapp?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      DB_USER: monapp_user
      DB_PASSWORD: monapp_pass

volumes:
  mysql-data: